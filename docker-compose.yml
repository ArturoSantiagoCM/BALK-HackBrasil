# Padrão: só a API (FastAPI). A orquestração diária é um cron que chama POST /jobs/daily (ver docs/OPERACAO.md);
# o n8n é OPCIONAL (perfil "n8n"). O QGIS é opcional (Dockerfile.qgis, perfil "qgis").
#   docker compose up --build                       # só a API
#   docker compose --profile n8n up --build         # API + n8n
# STATUS: não testado nesta máquina (sem Docker). A API sobe em BALK_ENV=production: RECUSA subir se faltarem
# BALK_API_KEY, PUBLIC_BASE_URL https etc. Para só experimentar localmente, ponha BALK_ENV=dev no .env.
services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]   # só o proxy https (Caddy) na frente fala com a API; ninguém de fora entra por http
    env_file: [.env]
    environment:
      - BALK_ENV=${BALK_ENV:-production}
      - ENGINE=${ENGINE:-python}
      - DATA_MODE=${DATA_MODE:-auto}
    volumes:
      - ./work:/srv/balk/work
      - balk_db:/srv/balk/data_store
    restart: unless-stopped
  api-qgis:
    profiles: ["qgis"]
    build: {context: ., dockerfile: Dockerfile.qgis}
    ports: ["127.0.0.1:8001:8000"]   # modo dev (simulador, /outbox, apagar tudo): só na própria máquina
    env_file: [.env]
    environment: [BALK_ENV=dev]
  n8n:
    profiles: ["n8n"]
    image: n8nio/n8n:latest
    ports: ["127.0.0.1:5678:5678"]   # só na própria máquina; exponha por proxy com senha se precisar
    environment:
      - N8N_SECURE_COOKIE=true
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - WHATSAPP_PHONE_ID=${WHATSAPP_PHONE_ID:-}
      - TWILIO_FROM=${TWILIO_FROM:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/imports:ro   # importe os JSON de /imports pela interface
    depends_on: [api]
    restart: unless-stopped
  openwa:
    # WhatsApp da DEMONSTRAÇÃO (gateway não oficial, MIT; ver docs/CANAIS_REAIS.md). STATUS: não testado nesta máquina.
    # No .env do BALK: OPENWA_URL=http://openwa:2785. Chave do painel: docker compose exec openwa cat /app/data/.api-key
    # Webhook do OpenWA para o BALK: http://api:8000/webhooks/openwa (por isso o SSRF_ALLOWED_HOSTS=api).
    profiles: ["openwa"]
    image: ghcr.io/rmyndharis/openwa:latest   # fixe a versão (ex.: :0.32.1) depois de testar
    ports: ["127.0.0.1:2785:2785"]   # painel e API só na própria máquina (abra por túnel SSH)
    environment:
      - NODE_ENV=production
      - SSRF_ALLOWED_HOSTS=api
      - TZ=America/Sao_Paulo
    volumes:
      - openwa_data:/app/data
    restart: unless-stopped
volumes:
  balk_db:
  n8n_data:
  openwa_data:
