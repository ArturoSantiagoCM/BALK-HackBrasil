<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>BALK: histórico por safra</title>
  <link rel="stylesheet" href="/app/css/site.css">
  <link rel="shortcut icon" href="/app/assets/favicon.png" type="image/x-icon">
</head>

<body>
  <header class="topo">
    <div class="wrap">
      <a class="logo" href="/" title="Voltar ao início"><svg width="134" height="58" viewBox="0 0 134 58" role="img"
          aria-label="BALK"><text x="8" y="36" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="40"
            font-weight="400" letter-spacing="3" class="logo-t">BALK</text>
          <rect x="2" y="41" width="3" height="12" fill="#FFDF00" />
          <rect x="8" y="44" width="50" height="3" fill="#009C3B" />
          <circle cx="66" cy="45.5" r="4.5" fill="#FFDF00" stroke="#009C3B" stroke-width="2" />
          <rect x="74" y="44" width="50" height="3" fill="#FFDF00" />
          <rect x="127" y="41" width="3" height="12" fill="#009C3B" />
        </svg></a>
      <nav><a href="/app/mapa.html">Mapa</a> <a href="/app/meus.html">Minha área</a></nav>
    </div>
  </header>
  <main class="wrap">
    <h1>Histórico por safra</h1>
    <p class="suave">O que o satélite viu em cada talhão, safra a safra. Informe a produtividade ao fechar a safra:
      assim os próximos avisos comparam com o que já aconteceu aí.</p>
    <p id="erroGeral" class="erro escondido" role="alert"></p>
    <section id="semSessao" class="card escondido">
      <p>Confirme o seu número para ver o histórico.</p><a class="btn" href="/app/cadastro.html">Entrar</a>
    </section>
    <div id="safras"></div>
    <h2>Avisos enviados</h2>
    <div id="avisos"></div>
  </main>
  <script type="module" src="/app/js/historico.js"></script>
</body>

</html>
