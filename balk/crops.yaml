# Faixas por cultura: a = mínimo absoluto, b = ótimo mínimo, c = ótimo máximo, d = máximo absoluto.
# STATUS: referência pública, EM REVISÃO. Os números abaixo são PONTOS DE PARTIDA aproximados
# inspirados nas faixas do FAO EcoCrop (ecocrop.apps.fao.org) e NÃO foram conferidos linha a linha:
# conferir cada valor na fonte antes de qualquer uso real. Chuva e temperatura valem para o CICLO
# da cultura (ciclo_meses). A faixa de declividade é premissa da equipe (o EcoCrop não traz).
padrao:
  pesos: {temp_media_c: 0.3, chuva_mm: 0.3, declive_pct: 0.2, argila_pct: 0.1, ndvi_regular: 0.1}
  # regularidade do NDVI = desvio padrão dentro do círculo (menor é melhor). Mede a condição
  # atual da área, não a aptidão da cultura; por isso peso baixo.
  ndvi_std: {a: -1.0, b: 0.0, c: 0.08, d: 0.25}
  orientacao_por_fator:
    temp_media_c: "A temperatura média da época fica fora da faixa ideal para esta cultura. Avalie outra época de plantio ou outra cultura."
    chuva_mm: "A chuva histórica da época fica fora do ideal. Avalie irrigação suplementar, drenagem ou outra cultura."
    declive_pct: "O terreno é inclinado para esta cultura. Avalie curvas de nível ou outra cultura."
    argila_pct: "A textura do solo estimada não é a ideal. Vale conferir com uma análise de solo."
    ndvi_regular: "A lavoura está irregular na área analisada. Vale uma volta no talhão para conferir."
  orientacao_sem_limite: "Sem fator crítico nos dados disponíveis. Mantenha o acompanhamento."
culturas:
  soja:
    fonte: "FAO EcoCrop (valores aproximados, conferir); declive = premissa da equipe"
    ciclo_meses: 5
    ciclo_dias: 120
    mes_plantio_usual: 10
    produtividade_t_ha: 3.5   # premissa; trocar pela média municipal do IBGE/PAM
    fatores:
      temp_media_c: {a: 10, b: 20, c: 30, d: 38}
      chuva_mm: {a: 300, b: 450, c: 800, d: 1200}
      declive_pct: {a: -1, b: 0, c: 8, d: 30}
      argila_pct: {a: 5, b: 20, c: 60, d: 80}
  milho:
    fonte: "FAO EcoCrop (valores aproximados, conferir); declive = premissa da equipe"
    ciclo_meses: 5
    ciclo_dias: 130
    mes_plantio_usual: 10
    produtividade_t_ha: 5.5
    fatores:
      temp_media_c: {a: 10, b: 18, c: 27, d: 35}
      chuva_mm: {a: 300, b: 400, c: 800, d: 1200}
      declive_pct: {a: -1, b: 0, c: 8, d: 30}
      argila_pct: {a: 5, b: 15, c: 55, d: 75}
  cafe:
    fonte: "FAO EcoCrop (arábica, valores aproximados, conferir); declive = premissa da equipe"
    ciclo_meses: 12
    ciclo_dias: 365
    mes_plantio_usual: 10
    produtividade_t_ha: 1.8
    fatores:
      temp_media_c: {a: 15, b: 18, c: 23, d: 28}
      chuva_mm: {a: 1000, b: 1400, c: 1800, d: 2500}
      declive_pct: {a: -1, b: 0, c: 20, d: 45}
      argila_pct: {a: 10, b: 25, c: 60, d: 80}
  feijao:
    fonte: "FAO EcoCrop (valores aproximados, conferir); declive = premissa da equipe"
    ciclo_meses: 3
    ciclo_dias: 90
    mes_plantio_usual: 3
    produtividade_t_ha: 1.1
    fatores:
      temp_media_c: {a: 12, b: 18, c: 25, d: 32}
      chuva_mm: {a: 150, b: 200, c: 450, d: 700}
      declive_pct: {a: -1, b: 0, c: 8, d: 25}
      argila_pct: {a: 5, b: 15, c: 45, d: 70}
  hortalica:
    fonte: "FAO EcoCrop (hortaliça folhosa genérica, valores aproximados, conferir); declive = premissa"
    ciclo_meses: 3
    ciclo_dias: 60
    mes_plantio_usual: 4
    produtividade_t_ha: 20
    fatores:
      temp_media_c: {a: 7, b: 15, c: 22, d: 30}
      chuva_mm: {a: 100, b: 150, c: 400, d: 600}
      declive_pct: {a: -1, b: 0, c: 6, d: 20}
      argila_pct: {a: 5, b: 15, c: 40, d: 60}
