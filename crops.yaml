# Faixas por cultura: a = mínimo absoluto, b = ótimo mínimo, c = ótimo máximo, d = máximo absoluto.
# STATUS: referência pública, EM REVISÃO. Os números abaixo são PONTOS DE PARTIDA aproximados
# inspirados nas faixas do FAO EcoCrop (ecocrop.apps.fao.org) e NÃO foram conferidos linha a linha:
# conferir cada valor na fonte antes de qualquer uso real. Chuva e temperatura valem para o CICLO
# da cultura (ciclo_meses). A faixa de declividade é premissa da equipe (o EcoCrop não traz).
padrao:
  pesos: {temp_media_c: 0.25, chuva_mm: 0.25, declive_pct: 0.15, argila_pct: 0.1, ph: 0.1, geadas_ciclo: 0.1, ndvi_regular: 0.05}
  # regularidade do NDVI = desvio padrão dentro do círculo (menor é melhor). Mede a condição
  # atual da área, não a aptidão da cultura; por isso peso baixo.
  ndvi_std: {a: -1.0, b: 0.0, c: 0.08, d: 0.25}
  orientacao_por_fator:
    temp_media_c: "A temperatura média da época fica fora da faixa ideal para esta cultura. Avalie outra época de plantio ou outra cultura."
    chuva_mm: "A chuva histórica da época fica fora do ideal. Avalie irrigação suplementar, drenagem ou outra cultura."
    declive_pct: "O terreno é inclinado para esta cultura. Avalie curvas de nível ou outra cultura."
    argila_pct: "A textura do solo estimada não é a ideal. Vale conferir com uma análise de solo."
    ph: "O pH estimado do solo está fora da faixa ideal. Vale uma análise de solo antes de decidir."
    geadas_ciclo: "O histórico mostra geadas demais no ciclo desta cultura. Avalie outra época ou cultura."
    ndvi_regular: "A lavoura está irregular na área analisada. Vale uma volta no talhão para conferir."
  orientacao_sem_limite: "Sem fator crítico nos dados disponíveis. Mantenha o acompanhamento."
culturas:
  soja:
    fonte: "FAO EcoCrop (valores aproximados, conferir); declive = premissa da equipe"
    ciclo_meses: 5
    ciclo_dias: 120
    mes_plantio_usual: 10
    produtividade_t_ha: 3.5   # premissa; trocar pela média municipal do IBGE/PAM
    fatores:
      temp_media_c: {a: 10, b: 20, c: 30, d: 38}
      chuva_mm: {a: 300, b: 450, c: 700, d: 1200}   # c ajustado de 800 para 700 (FAO: 450-700 mm por ciclo)
      declive_pct: {a: -1, b: 0, c: 8, d: 30}
      argila_pct: {a: 5, b: 20, c: 60, d: 80}
      ph: {a: 4.5, b: 5.5, c: 6.5, d: 8.0}          # c ajustado de 6.8 para 6.5 (Embrapa: 5,5-6,5)
      geadas_ciclo: {a: -1, b: 0, c: 0, d: 3}   # dias de geada por ciclo (histórico); premissa
  milho:
    fonte: "FAO EcoCrop (valores aproximados, conferir); declive = premissa da equipe"
    ciclo_meses: 5
    ciclo_dias: 130
    mes_plantio_usual: 10
    produtividade_t_ha: 5.5
    fatores:
      temp_media_c: {a: 10, b: 24, c: 30, d: 35}    # ótimo ajustado de 18-27 para 24-30 (literatura brasileira)
      chuva_mm: {a: 300, b: 500, c: 800, d: 1200}   # b ajustado de 400 para 500 (500-800 mm por ciclo)
      declive_pct: {a: -1, b: 0, c: 8, d: 30}
      argila_pct: {a: 5, b: 15, c: 55, d: 75}
      ph: {a: 4.5, b: 5.5, c: 6.5, d: 8.0}          # c ajustado de 7.0 para 6.5 (Embrapa: 5,5-6,5)
      geadas_ciclo: {a: -1, b: 0, c: 1, d: 4}   # dias de geada por ciclo (histórico); premissa
  cafe:
    fonte: "FAO EcoCrop (arábica, valores aproximados, conferir); declive = premissa da equipe"
    ciclo_meses: 12
    ciclo_dias: 365
    mes_plantio_usual: 10
    produtividade_t_ha: 1.8
    fatores:
      temp_media_c: {a: 15, b: 18, c: 23, d: 28}
      chuva_mm: {a: 1000, b: 1200, c: 1800, d: 2500}   # b ajustado de 1400 para 1200 (ZARC/MAPA: 1200-1800 mm/ano)
      declive_pct: {a: -1, b: 0, c: 20, d: 45}
      argila_pct: {a: 10, b: 25, c: 60, d: 80}
      ph: {a: 4.5, b: 5.5, c: 6.0, d: 7.5}          # b ajustado de 5.0 para 5.5 (manuais citam alvo 5,8-6,0)
      geadas_ciclo: {a: -1, b: 0, c: 0, d: 2}   # dias de geada por ciclo (histórico); premissa
  feijao:
    fonte: "FAO EcoCrop (valores aproximados, conferir); declive = premissa da equipe"
    ciclo_meses: 3
    ciclo_dias: 90
    mes_plantio_usual: 3
    produtividade_t_ha: 1.1
    fatores:
      temp_media_c: {a: 12, b: 18, c: 24, d: 30}    # Embrapa: ótima 18-24; acima de 30 e abaixo de 12 prejudica
      chuva_mm: {a: 150, b: 200, c: 450, d: 700}
      declive_pct: {a: -1, b: 0, c: 8, d: 25}
      argila_pct: {a: 5, b: 15, c: 45, d: 70}
      ph: {a: 4.5, b: 5.5, c: 6.8, d: 8.0}
      geadas_ciclo: {a: -1, b: 0, c: 0, d: 2}   # dias de geada por ciclo (histórico); premissa
  hortalica:
    fonte: "FAO EcoCrop (hortaliça folhosa genérica, valores aproximados, conferir); declive = premissa"
    ciclo_meses: 3
    ciclo_dias: 60
    mes_plantio_usual: 4
    produtividade_t_ha: 20
    fatores:
      temp_media_c: {a: 7, b: 15, c: 22, d: 30}
      chuva_mm: {a: 100, b: 150, c: 400, d: 600}
      declive_pct: {a: -1, b: 0, c: 6, d: 20}
      argila_pct: {a: 5, b: 15, c: 40, d: 60}
      ph: {a: 4.5, b: 6.0, c: 6.5, d: 8.0}          # c ajustado de 7.0 para 6.5 (Embrapa: 6,0-6,5 para a maioria)
      geadas_ciclo: {a: -1, b: 0, c: 1, d: 5}   # dias de geada por ciclo (histórico); premissa

# ---------------------------------------------------------------------------------------------------------
# Rastreabilidade: de onde vem cada faixa e em que pé está. Conferido por busca na web em 26/11/2026
# (detalhes em docs/VALIDACAO_REGRAS.md). NÃO é validação por agrônomo. A página de relatório mostra isto.
# status: confirmado (fonte oficial/técnica bate com o valor) | ajustado (valor mudou para bater com a fonte) |
#         parcial (fonte confirma parte) | premissa (sem fonte encontrada; hipótese da equipe)
# ---------------------------------------------------------------------------------------------------------
fontes:
  EMB_SOJA_TEMP: {titulo: "Embrapa Soja: exigências climáticas, temperatura", url: "https://www.embrapa.br/en/web/agencia-de-informacao-tecnologica/cultivos/soja/pre-producao/caracteristicas-da-especie-e-relacoes-com-o-ambiente/exigencias-climaticas/temperatura"}
  FAO_SOJA_AGUA: {titulo: "Necessidade de água da soja, 450-700 mm (FAO 1986/2002, citado em artigo)", url: "https://www.cabidigitallibrary.org/doi/pdf/10.5555/20143319107"}
  AGRAER_MILHO: {titulo: "Manual de recomendações técnicas, cultura do milho (AGRAER-MS): 500-800 mm", url: "https://www.agraer.ms.gov.br/wp-content/uploads/2015/05/Manual_de_recomenda%C3%A7%C3%B5es_t%C3%A9cnicas_cultura_do_milho.pdf"}
  MILHO_TEMP: {titulo: "Artigo: milho tolera 10-30 C, ideal 24-30 C", url: "https://ojs.revistadelos.com/ojs/index.php/delos/article/download/4035/2290/9032"}
  GAEZ_MILHO: {titulo: "FAO GAEZ v4, perfil do milho", url: "https://s3.eu-west-1.amazonaws.com/data.gaezdev.aws.fao.org/crop_profiles/GAEZ_Crop_profile_maize.pdf"}
  ZARC_CAFE: {titulo: "Portaria SPA/MAPA 579/2021 (ZARC café arábica): chuva ótima 1200-1800 mm", url: "https://www.gov.br/agricultura/pt-br/assuntos/riscos-seguro/programa-nacional-de-zoneamento-agricola-de-risco-climatico/portarias/safra-vigente/espirito-santo/word/PORTN579CAFARBICAES.ret.pdf"}
  CAFEPOINT: {titulo: "Café arábica: temperatura média de aptidão 18-23 C", url: "https://www.cafepoint.com.br/noticias/tecnicas-de-producao/10-fatores-que-precisam-de-atencao-no-planejamento-da-implantacao-de-lavoura-de-cafe-arabica-234850/"}
  INCAPER_CAFE_PH: {titulo: "Incaper: pH sugerido para café 5,8-6,0", url: "https://biblioteca.incaper.es.gov.br/digital/bitstream/item/2746/1/BRT-saturacaoporbaseparaocafeeiro-guarconi.pdf"}
  EMB_FEIJAO_CLIMA: {titulo: "Embrapa Feijão: clima (ótima 18-24 C)", url: "https://www.atermaisdigital.cnptia.embrapa.br/web/feijao/clima"}
  EMB_PH: {titulo: "Embrapa: pH ideal 5,5-6,5 para arroz, milho e soja", url: "https://www.embrapa.br/en/web/agencia-de-informacao-tecnologica/cultivos/arroz/producao/sistema-de-cultivo/arroz-de-terras-altas/correcao-do-solo-e-adubacao/correcao-da-acidez-do-solo"}
  EMB_PH_CIRC: {titulo: "Embrapa, circular técnica: pH 6,0-6,5 para a maioria das plantas", url: "https://www.infoteca.cnptia.embrapa.br/infoteca/bitstream/doc/1176428/1/COSTA-MAGNA-CIR-TEC-145.pdf"}
  EMB_RELEVO: {titulo: "Embrapa: classes de relevo por declividade (plano 0-3, suave 3-8, ondulado 8-20, forte 20-45 %)", url: "https://www.embrapa.br/en/web/agencia-de-informacao-tecnologica/territorios/territorio-mata-sul-pernambucana/caracteristicas-do-territorio/recursos-naturais/relevo"}
  GEADA_UEL: {titulo: "Diferença de mínima entre abrigo e relva em noites de geada: 4,2 a 6,3 C (Semina, 2018)", url: "https://agris.fao.org/search/en/providers/122436/records/67597eb3c7a957febdf90cea"}
  EXTRA_PADRAO: {titulo: "Sem fonte encontrada: hipótese da equipe, em revisão", url: ""}
validacao:
  soja: {temp_media_c: {status: confirmado, fonte: EMB_SOJA_TEMP}, chuva_mm: {status: ajustado, fonte: FAO_SOJA_AGUA}, declive_pct: {status: parcial, fonte: EMB_RELEVO}, argila_pct: {status: premissa, fonte: EXTRA_PADRAO}, ph: {status: ajustado, fonte: EMB_PH}, geadas_ciclo: {status: premissa, fonte: EXTRA_PADRAO}}
  milho: {temp_media_c: {status: ajustado, fonte: MILHO_TEMP}, chuva_mm: {status: ajustado, fonte: AGRAER_MILHO}, declive_pct: {status: parcial, fonte: EMB_RELEVO}, argila_pct: {status: premissa, fonte: EXTRA_PADRAO}, ph: {status: ajustado, fonte: EMB_PH}, geadas_ciclo: {status: premissa, fonte: EXTRA_PADRAO}}
  cafe: {temp_media_c: {status: confirmado, fonte: CAFEPOINT}, chuva_mm: {status: ajustado, fonte: ZARC_CAFE}, declive_pct: {status: parcial, fonte: EMB_RELEVO}, argila_pct: {status: premissa, fonte: EXTRA_PADRAO}, ph: {status: ajustado, fonte: INCAPER_CAFE_PH}, geadas_ciclo: {status: premissa, fonte: EXTRA_PADRAO}}
  feijao: {temp_media_c: {status: ajustado, fonte: EMB_FEIJAO_CLIMA}, chuva_mm: {status: premissa, fonte: EXTRA_PADRAO}, declive_pct: {status: parcial, fonte: EMB_RELEVO}, argila_pct: {status: premissa, fonte: EXTRA_PADRAO}, ph: {status: premissa, fonte: EMB_PH_CIRC}, geadas_ciclo: {status: premissa, fonte: EXTRA_PADRAO}}
  hortalica: {temp_media_c: {status: premissa, fonte: EXTRA_PADRAO}, chuva_mm: {status: premissa, fonte: EXTRA_PADRAO}, declive_pct: {status: parcial, fonte: EMB_RELEVO}, argila_pct: {status: premissa, fonte: EXTRA_PADRAO}, ph: {status: ajustado, fonte: EMB_PH_CIRC}, geadas_ciclo: {status: premissa, fonte: EXTRA_PADRAO}}
  _comum: {ndvi_regular: {status: premissa, fonte: EXTRA_PADRAO}}
